# Palmface: tmux. Rosé Pine status bar, session persistence, an idle screensaver.
# Kit-owned: a re-install replaces this file. ~/.tmux.conf sources it from a palmface block,
# so put your own settings in ~/.tmux.conf after that block and they win.

# ── Better defaults ──
set -g default-terminal "tmux-256color"
# true colour for Ghostty and xterm-likes (appended once, not again on every reload)
if-shell -F '#{@palmface-loaded}' '' 'set -ga terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"'
# Passthrough lets terminal images (kitty protocol) through tmux. It also lets any program in a
# pane send escape sequences straight to Ghostty, past tmux's filtering. To turn it off, add
# `set -g allow-passthrough off` after the palmface block in ~/.tmux.conf.
set -g allow-passthrough on
set -g status-position top
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0

# ── Prefix: Ctrl+a (easier to reach than Ctrl+b), only if you never changed the prefix ──
# To keep Ctrl+b anyway, add after the palmface block in ~/.tmux.conf:
#   set -g prefix C-b
#   bind C-b send-prefix
if-shell -F '#{==:#{prefix},C-b}' 'set -g prefix C-a ; unbind C-b ; bind C-a send-prefix'

# ── Reload: prefix + r ──
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# ── Splits and new windows keep the current path ──
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Pane borders in Rosé Pine (ANSI slots, so they follow light/dark) ──
set -g pane-active-border-style "fg=magenta"
set -g pane-border-style "fg=brightblack"

# ── Plugins: rose-pine, tmux-resurrect, tmux-continuum (list: plugins.list next to this file).
# The install fetches each at the commit pinned in plugins.list into
# ~/.config/palmface/tmux/plugins/, and load-plugins.sh runs them. Palmface does not use tpm, so a
# tpm of your own is never touched. Updates come with a new Palmface release (a new pin).

# Resurrect: prefix + Ctrl-s saves the session layout, prefix + Ctrl-r restores it. Saves go to
# resurrect's own default folder, ~/.local/share/tmux/resurrect/ (or ~/.tmux/resurrect/): your
# data, which uninstalling Palmface leaves alone.
# Pane contents are not saved (they can hold secrets). To save what is on screen too:
#   set -g @resurrect-capture-pane-contents 'on'
#   set -g @resurrect-pane-contents-area 'visible'
# Each pane's running command line IS saved, every 15 minutes by continuum, so a command typed
# with a password or token in it (psql postgres://user:pw@..., curl -H "Authorization: ...")
# lands in those save files. To stop the automatic saves, add after the palmface block:
#   set -g @continuum-save-interval '0'
# and delete old saves with: rm -rf ~/.local/share/tmux/resurrect ~/.tmux/resurrect

# Continuum: auto-save every 15 min, auto-restore when the tmux server starts.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Rosé Pine status bar. The plugin uses fixed colours: 'moon' is dark; use 'dawn' for light.
set -g @rose_pine_variant 'moon'
set -g @rose_pine_host 'off'
set -g @rose_pine_date_time '%H:%M'
set -g @rose_pine_directory 'on'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
set -g @rose_pine_window_separator ' · '
set -g @rose_pine_session_icon '🦉'
set -g @rose_pine_current_window_icon '✦'

# ── Idle screensaver: after 30 min without a key, a toy covers the screen; any key returns.
# (tmux counts only keys as activity, so 30 min leaves room to watch a long job.)
# Pause: mkdir -p ~/.cache/palmface && touch ~/.cache/palmface/screensaver.off (rm it to resume)
# Turn off for good: add `set -g lock-after-time 0` after the palmface block in ~/.tmux.conf.
set -g lock-after-time 1800
set -g lock-command '~/.config/palmface/bin/screensaver.sh'

# ── Run the plugins (keep last, after their options) ──
run-shell '~/.config/palmface/tmux/load-plugins.sh'
set -g @palmface-loaded 1
